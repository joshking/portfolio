<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: canvas-aurora-approved.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#080809}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-aurora-canvas region chrome" data-region="aurora-canvas"><!-- Black full-viewport WebGL canvas with a procedural cyan, blue, violet, and mint aurora constrained to the perimeter --></div>
  <div class="r-name region text" data-region="name"><!-- JOSH KING, uppercase Montserrat --><p style="font-size:var(--r-name-font);line-height:1.05;margin:0">name</p></div>
  <div class="r-navigation region control" data-region="navigation"><!-- WORK LAB ABOUT CONTACT, horizontal text navigation: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop navigation); a control need not have button chrome --></div>
  <div class="r-role region text" data-region="role"><!-- PRODUCT DESIGNER, uppercase Montserrat --><p style="font-size:var(--r-role-font);font-family:var(--r-role-family),sans-serif;font-weight:var(--r-role-weight);line-height:1.05;margin:0">role</p></div>
  <div class="r-disciplines region text" data-region="disciplines"><!-- DESIGN · CODE · AI, uppercase DM Sans --><p style="font-size:var(--r-disciplines-font);line-height:1.05;margin:0">disciplines</p></div>
  <div class="r-latest-work region control" data-region="latest-work"><!-- VIEW LATEST WORK, text link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop latest-work); a control need not have button chrome --></div>
</main>
</body>
</html>
